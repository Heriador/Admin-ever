services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: admin_ever
      POSTGRES_USER: admin_ever
      POSTGRES_PASSWORD: admin_ever
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_ever"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
